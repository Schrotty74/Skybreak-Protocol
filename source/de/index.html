<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#02040d" />
    <meta name="description" content="Skybreak Protocol – ein vertikales Cyberpunk-Arcade-Spiel für Desktop und Mobilbrowser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skybreak" />
    <link rel="alternate" hreflang="en" href="https://schrotty74.github.io/Skybreak-Protocol/" />
    <link rel="alternate" hreflang="de" href="https://schrotty74.github.io/Skybreak-Protocol/de/" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <title>Skybreak Protocol</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (new URLSearchParams(location.search).has("reset-profile")) {
        sessionStorage.setItem("skybreak-profile-reset", "1");
        for (let i = localStorage.length - 1; i >= 0; i -= 1) {
          const key = localStorage.key(i);
          if (key?.startsWith("skybreak-") || key === "neon-ascent-highscore") localStorage.removeItem(key);
        }
        history.replaceState(null, "", location.pathname + location.hash);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
