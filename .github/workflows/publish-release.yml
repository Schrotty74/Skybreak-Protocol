name: Publish beta or final release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "docs/releases/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:offline

      - name: Publish versioned release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          NOTES_DE="docs/releases/${VERSION}.md"
          NOTES_EN="docs/releases/${VERSION}.en.md"
          ARCHIVE="Skybreak-Protocol-${VERSION}-offline.zip"
          {
            echo "## English"
            echo
            tail -n +3 "$NOTES_EN"
            echo
            echo "---"
            echo
            echo "## Deutsch"
            echo
            tail -n +3 "$NOTES_DE"
          } > release-notes.md
          (cd release && zip -r "../${ARCHIVE}" "Skybreak-Protocol-${VERSION}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Skybreak Protocol $TAG" --notes-file release-notes.md
          else
            if [[ "$VERSION" == *-beta.* ]]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Skybreak Protocol $TAG" --notes-file release-notes.md --prerelease
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Skybreak Protocol $TAG" --notes-file release-notes.md --latest
            fi
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber
