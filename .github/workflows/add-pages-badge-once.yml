name: Add Pages badge once

on:
  push:
    paths:
      - .github/workflows/add-pages-badge-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add badge and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          badge = '[![Deploy Pages](https://github.com/Schrotty74/Skybreak-Protocol/actions/workflows/deploy-pages.yml/badge.svg)](https://github.com/Schrotty74/Skybreak-Protocol/actions/workflows/deploy-pages.yml)\n\n'
          marker = '# Skybreak Protocol\n\n'
          if 'actions/workflows/deploy-pages.yml/badge.svg' not in s:
              s = s.replace(marker, marker + badge, 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git rm .github/workflows/add-pages-badge-once.yml
          git commit -m "docs: show Pages deployment badge"
          git push
